<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Estante da Turma{% endblock %}</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 760px; margin: 32px auto; padding: 0 20px; color: #222; }
        nav { display: flex; flex-wrap: wrap; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid #ccc; }
        a { color: #164f91; }
        li { margin-bottom: 12px; }
        input, select, textarea, button { font: inherit; max-width: 100%; box-sizing: border-box; padding: 8px; }
        label { display: block; }
        button { cursor: pointer; }
        .errorlist { color: #9e1515; }
        footer { margin-top: 32px; border-top: 1px solid #ccc; }
    </style>
</head>
<body>
    <header>
        <p><strong>Estante da Turma</strong></p>
        <nav aria-label="Navegação principal">
            <a href="{% url 'catalogo:home' %}">Início</a>
            <a href="{% url 'catalogo:listar' %}">Ver livros</a>
            <a href="{% url 'catalogo:cadastrar' %}">Cadastrar livro</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer><p>Exemplo da monitoria de POO.</p></footer>
</body>
</html>
